
<!DOCTYPE html>
<html>

<body>
    <h1>Better xCloud</h1>
    <p>Protótipo experimental para Samsung Tizen TV.</p>
    <p>Diagnóstico das APIs disponíveis no aplicativo.</p>

    <button onclick="verificar()">Verificar novamente</button>

    <div id="resultado">Verificando...</div>

    <script>
        function verificar() {
            var resultado = document.getElementById("resultado");

            var dados = {
                webapis: typeof webapis,
                avplay: typeof webapis !== "undefined"
                    ? typeof webapis.avplay : "indisponível",
                tizen: typeof tizen,
                metodosAVPlay: []
            };

            try {
                if (typeof webapis !== "undefined" &&
                    webapis.avplay) {
                    dados.metodosAVPlay =
                        Object.keys(webapis.avplay);
                }
            } catch (e) {
                dados.erro = e.message;
            }

            resultado.textContent =
                JSON.stringify(dados, null, 2);
        }

        window.onload = verificar;
    </script>
