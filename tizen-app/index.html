
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Better xCloud</title>

    <script src="$WEBAPIS/webapis/webapis.js"></script>

    <style>
        body {
            margin: 0;
            padding: 50px;
            background: #10131b;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #79b8ff;
            font-size: 38px;
        }

        p {
            font-size: 23px;
            line-height: 1.5;
        }

        button {
            padding: 18px 30px;
            font-size: 22px;
            background: #107c10;
            color: white;
            border: 0;
            border-radius: 8px;
        }

        #resultado {
            margin-top: 25px;
            white-space: pre-wrap;
            font-size: 20px;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <h1>Better xCloud</h1>
    <p>Protótipo experimental para Samsung Tizen TV.</p>
    <p>Diagnóstico das APIs disponíveis no aplicativo.</p>

    <button onclick="verificar()">Verificar novamente</button>

    <div id="resultado">Verificando...</div>

    <script>
function verificar() {
    var saida = document.getElementById("resultado");

    var nomes = [
        "open", "close", "prepare", "prepareAsync",
        "setDisplayRect", "getVideoSize", "getCodecInfo",
        "play", "pause", "stop", "getState",
        "seekTo", "getDuration", "getCurrentTime",
        "setListener", "setDrm", "getUID",
        "setStreamingProperty", "getStreamingProperty",
        "getVersion", "setDisplayMethod", "setSelectTrack",
        "getCurrentStreamInfo", "getTotalTrackInfo"
    ];

    var dados = {
        webapis: typeof window.webapis,
        avplay: "indisponível",
        tizen: typeof window.tizen,
        metodosAVPlay: {},
        metodosDisponiveis: [],
        metodosIndisponiveis: [],
        testeGetState: "não executado",
        versaoAVPlay: "não consultada"
    };

    try {
        if (window.webapis && window.webapis.avplay) {
            var av = window.webapis.avplay;
            dados.avplay = typeof av;

            for (var i = 0; i < nomes.length; i++) {
                var nome = nomes[i];
                var tipo = typeof av[nome];

                dados.metodosAVPlay[nome] = tipo;

                if (tipo === "function") {
                    dados.metodosDisponiveis.push(nome);
                } else {
                    dados.metodosIndisponiveis.push(nome);
                }
            }

            if (typeof av.getState === "function") {
                try {
                    dados.testeGetState = av.getState();
                } catch (e) {
                    dados.testeGetState = "ERRO: " + e.name + " " + e.message;
                }
            }

            if (typeof av.getVersion === "function") {
                try {
                    dados.versaoAVPlay = av.getVersion();
                } catch (e) {
                    dados.versaoAVPlay = "ERRO: " + e.name + " " + e.message;
                }
            }
        }
    } catch (e) {
        dados.erroGeral = e.name + " " + e.message;
    }

    saida.textContent = JSON.stringify(dados, null, 2);
}

window.onload = verificar;
</script>
