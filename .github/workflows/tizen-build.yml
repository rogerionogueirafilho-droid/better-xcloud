name: Build Tizen WGT

on:
  workflow_dispatch:
  push:
    branches:
      - tizen-tu8000-prototype
    paths:
      - "tizen-app/**"
      - ".github/workflows/tizen-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils zip unzip

      - name: Validate app
        run: |
          xmllint --noout tizen-app/config.xml
          test -s tizen-app/index.html
          grep -q '<content src="index.html"' tizen-app/config.xml

      - name: Package WGT
        run: |
          mkdir -p dist
          cd tizen-app
          zip -X -q ../dist/BetterXCloud-TU8000.wgt config.xml index.html

      - name: Verify package
        run: |
          unzip -t dist/BetterXCloud-TU8000.wgt
          unzip -l dist/BetterXCloud-TU8000.wgt

      - name: Upload WGT
        uses: actions/upload-artifact@v4
        with:
          name: BetterXCloud-TU8000-WGT
          path: dist/BetterXCloud-TU8000.wgt
          if-no-files-found: error
          retention-days: 14
